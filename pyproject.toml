[project]
name = "terrain-coach"
version = "0.1.0"
description = "Local terrain-aware cycling workouts for Garmin Edge"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "fit-tool==0.9.16",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[project.scripts]
terrain-coach = "terrain_coach:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
